<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="filmG" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#004d26"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>
     <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Film Strip Background (Zig-Zag style inspired by FFmpeg logo) -->
  <path d="M8 12 C 8 8 12 8 12 8 L 52 8 C 52 8 56 8 56 12 L 56 52 C 56 56 52 56 52 56 L 12 56 C 12 56 8 56 8 52 Z" fill="#303030" stroke="#4a4a4a" stroke-width="2"/>
  
  <!-- Film Perforations -->
  <rect x="12" y="14" width="6" height="4" fill="white" rx="1" fill-opacity="0.9"/>
  <rect x="12" y="24" width="6" height="4" fill="white" rx="1" fill-opacity="0.9"/>
  <rect x="12" y="34" width="6" height="4" fill="white" rx="1" fill-opacity="0.9"/>
  <rect x="12" y="44" width="6" height="4" fill="white" rx="1" fill-opacity="0.9"/>

  <rect x="46" y="14" width="6" height="4" fill="white" rx="1" fill-opacity="0.9"/>
  <rect x="46" y="24" width="6" height="4" fill="white" rx="1" fill-opacity="0.9"/>
  <rect x="46" y="34" width="6" height="4" fill="white" rx="1" fill-opacity="0.9"/>
  <rect x="46" y="44" width="6" height="4" fill="white" rx="1" fill-opacity="0.9"/>

  <!-- Center 'Play' shape resembling the F and play button combined -->
  <path d="M28 20 L 40 32 L 28 44" stroke="#00b050" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none" filter="url(#glow)"/>
  <path d="M24 32 L 36 32" stroke="#00b050" stroke-width="4" stroke-linecap="round" stroke-opacity="0.8"/>

</svg>
